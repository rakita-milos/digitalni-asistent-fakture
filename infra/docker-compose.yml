name: digitalni-asistent

# Sprint 0: samo infrastruktura (Postgres 16 + Redis 7).
# API/web se pokreću na hostu (pnpm dev); kontejnerizacija je kasnije.
#
# Pokretanje: docker compose -f infra/docker-compose.yml up -d      (ili: pnpm db:up)
# Status:     docker compose -f infra/docker-compose.yml ps

services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digitalni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalni}
      POSTGRES_DB: ${POSTGRES_DB:-digitalni_asistent}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-digitalni} -d ${POSTGRES_DB:-digitalni_asistent}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digitalni-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
