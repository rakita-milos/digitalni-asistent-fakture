name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      allow_debug_signing:
        description: 'Dozvoli AAB potpisan debug ključem (samo provjera pipeline-a, ne za Play)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.9'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digitalni
          POSTGRES_PASSWORD: digitalni
          POSTGRES_DB: digitalni_asistent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalni -d digitalni_asistent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://digitalni:digitalni@localhost:5432/digitalni_asistent?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      SMS_PROVIDER: log
      RATE_LIMIT_ENABLED: 'false'
      # Pun API e2e set (19 fajlova) traži više heap-a; bez ovoga worker može pasti sa
      # ERR_IPC_CHANNEL_CLOSED (viđeno lokalno na Windowsu, S11-8).
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter api exec prisma generate

      - name: Prisma schema validacija
        run: pnpm --filter api exec prisma validate

      - name: Prisma migracije (deploy na CI bazu)
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testovi (e2e koriste Postgres + Redis)
        run: pnpm test

      - name: Build (web + api + shared)
        run: pnpm build

      - name: Play grafički materijal (dimenzije, odnos, providnost)
        run: node tools/check-play-assets.mjs

      - name: Pilot alati (šablon + samoprovjera)
        run: |
          node tools/pilot/selftest.mjs
          node tools/pilot/status.mjs --example --today=2026-11-23

      - name: Prisma status
        run: pnpm --filter api exec prisma migrate status

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validiraj docker-compose.yml
        run: docker compose -f infra/docker-compose.yml config --quiet

  android:
    name: android debug build (APK)
    runs-on: ubuntu-latest
    # Hladan run skida NDK 27.1, CMake, platform 37 i Gradle 9.4.1; 40 min je tijesno.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runneri imaju Android SDK preinstaliran; setup-android@v3 je pao na
      # prvom runu (16.11.2026) prije ijednog koraka projekta, pa koristimo SDK sa image-a.
      - name: Android SDK (preinstalled na runneru)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "Android SDK nije na $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls "$SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --version || true
          fi

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Link React Native packages (pnpm hoisted)
        working-directory: apps/mobile
        run: |
          mkdir -p node_modules
          ln -sfn ../../../node_modules/react-native node_modules/react-native
          ln -sfn ../../../node_modules/@react-native node_modules/@react-native

      - name: Debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: digitalni-asistent-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-release:
    name: android release AAB
    runs-on: ubuntu-latest
    # AAB za Play se pravi ručno (workflow_dispatch) ili na tag `v*`; ne na svaki push.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Isti pristup kao u `android` jobu: SDK je preinstaliran na runneru.
      - name: Android SDK (preinstalled na runneru)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "Android SDK nije na $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls "$SDK"

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-

      - name: Link React Native packages (pnpm hoisted)
        working-directory: apps/mobile
        run: |
          mkdir -p node_modules
          ln -sfn ../../../node_modules/react-native node_modules/react-native
          ln -sfn ../../../node_modules/@react-native node_modules/@react-native

      # Bez keystore-a Gradle potpiše release debug ključem (vidi app/build.gradle).
      # Takav AAB služi samo kao dokaz da pipeline radi — ne smije na Play.
      # Pravilo: na tag push se debug potpis dozvoljava samo za `-rc` tagove; pravi release
      # tag (npr. v1.0.0) bez keystore-a pada, da se ne pošalje pogrešan AAB.
      - name: Provjera release keystore-a
        env:
          DA_KEYSTORE_PATH: ${{ secrets.DA_KEYSTORE_PATH }}
          ALLOW_DEBUG_INPUT: ${{ inputs.allow_debug_signing }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DA_KEYSTORE_PATH:-}" ]; then
            if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == *-rc* ]]; then
              echo "::warning::RC tag bez keystore-a — AAB će biti potpisan DEBUG ključem (nije za Play)."
            elif [ "$ALLOW_DEBUG_INPUT" != "true" ]; then
              echo "::error::DA_KEYSTORE_PATH nije postavljen, a debug potpis nije dozvoljen."
              exit 1
            fi
            echo "::warning::DA_KEYSTORE_PATH nije postavljen — AAB će biti potpisan DEBUG ključem i nije za Play."
          else
            echo "Release keystore je postavljen."
          fi

      - name: Release AAB (bundleRelease)
        working-directory: apps/mobile/android
        env:
          DA_KEYSTORE_PATH: ${{ secrets.DA_KEYSTORE_PATH }}
          DA_KEYSTORE_PASSWORD: ${{ secrets.DA_KEYSTORE_PASSWORD }}
          DA_KEY_ALIAS: ${{ secrets.DA_KEY_ALIAS }}
          DA_KEY_PASSWORD: ${{ secrets.DA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Sačuvaj AAB
        uses: actions/upload-artifact@v4
        with:
          name: digitalni-asistent-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  integrations:
    name: integracije (R2 / SMS / Sentry)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digitalni
          POSTGRES_PASSWORD: digitalni
          POSTGRES_DB: digitalni_asistent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalni -d digitalni_asistent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://digitalni:digitalni@localhost:5432/digitalni_asistent?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      RATE_LIMIT_ENABLED: 'false'
      MAIL_PROVIDER: log
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migracije
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma migrate deploy

      - name: Build (api + web)
        run: pnpm build

      - name: Demo seed
        run: pnpm --filter api db:seed

      - name: Integracije (fake S3/SMS/Sentry + API)
        run: pnpm test:integrations

  e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digitalni
          POSTGRES_PASSWORD: digitalni
          POSTGRES_DB: digitalni_asistent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalni -d digitalni_asistent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://digitalni:digitalni@localhost:5432/digitalni_asistent?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      RATE_LIMIT_ENABLED: 'false'
      MAIL_PROVIDER: log
      SMS_PROVIDER: log
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migracije
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma migrate deploy

      - name: Build (web + api + shared)
        run: pnpm build

      - name: Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (globalSetup radi seed)
        run: pnpm --filter web test:e2e

      - name: Sačuvaj Playwright izvještaj
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
