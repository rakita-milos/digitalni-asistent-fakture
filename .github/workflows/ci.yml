name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
  # Sedmična provjera Docker image-a (samo `docker` job se izvršava na schedule).
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      allow_debug_signing:
        description: 'Dozvoli AAB potpisan debug ključem (samo provjera pipeline-a, ne za Play)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.9'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: lint / typecheck / test / build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digitalni
          POSTGRES_PASSWORD: digitalni
          POSTGRES_DB: digitalni_asistent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalni -d digitalni_asistent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://digitalni:digitalni@localhost:5432/digitalni_asistent?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      SMS_PROVIDER: log
      RATE_LIMIT_ENABLED: 'false'
      # Pun API e2e set (19 fajlova) traži više heap-a; bez ovoga worker može pasti sa
      # ERR_IPC_CHANNEL_CLOSED (viđeno lokalno na Windowsu, S11-8).
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter api exec prisma generate

      - name: Prisma schema validacija
        run: pnpm --filter api exec prisma validate

      - name: Prisma migracije (deploy na CI bazu)
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testovi (e2e koriste Postgres + Redis)
        run: pnpm test

      - name: Build (web + api + shared)
        run: pnpm build

      - name: Play grafički materijal (dimenzije, odnos, providnost)
        run: node tools/check-play-assets.mjs

      - name: Pilot alati (šablon + samoprovjera)
        run: |
          node tools/pilot/selftest.mjs
          node tools/pilot/status.mjs --example --today=2026-11-23

      - name: Release potpisivanje (konfiguracija, bez tajni)
        run: node tools/release/check-signing.mjs

      - name: Release preflight (informativno, bez tajni)
        run: node tools/release/preflight.mjs --json > /dev/null

      - name: Prisma status
        run: pnpm --filter api exec prisma migrate status

  compose:
    name: docker compose config
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validiraj docker-compose.yml
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Validiraj produkcijski compose
        run: docker compose -f infra/docker-compose.prod.yml config --quiet

  android:
    name: android debug build (APK)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Hladan run skida NDK 27.1, CMake, platform 37 i Gradle 9.4.1; 40 min je tijesno.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runneri imaju Android SDK preinstaliran; setup-android@v3 je pao na
      # prvom runu (16.11.2026) prije ijednog koraka projekta, pa koristimo SDK sa image-a.
      - name: Android SDK (preinstalled na runneru)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "Android SDK nije na $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls "$SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --version || true
          fi

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Link React Native packages (pnpm hoisted)
        working-directory: apps/mobile
        run: |
          mkdir -p node_modules
          ln -sfn ../../../node_modules/react-native node_modules/react-native
          ln -sfn ../../../node_modules/@react-native node_modules/@react-native

      # Bez DA_API_URL ostaje razvojni 10.0.2.2 (emulator); za fizičke uređaje se postavlja
      # staging/LAN URL u repository variable. Vidi docs/G12_EVIDENCE_PACK.md §3.6.
      - name: API URL za build
        env:
          DA_API_URL: ${{ vars.DA_API_URL }}
          DA_WEB_URL: ${{ vars.DA_WEB_URL }}
        run: node apps/mobile/scripts/set-api-url.mjs

      - name: Debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: digitalni-asistent-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-release:
    name: android release AAB
    runs-on: ubuntu-latest
    # AAB za Play se pravi ručno (workflow_dispatch) ili na tag `v*`; ne na svaki push.
    if: github.event_name != 'schedule' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Isti pristup kao u `android` jobu: SDK je preinstaliran na runneru.
      - name: Android SDK (preinstalled na runneru)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "Android SDK nije na $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls "$SDK"

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-

      - name: Link React Native packages (pnpm hoisted)
        working-directory: apps/mobile
        run: |
          mkdir -p node_modules
          ln -sfn ../../../node_modules/react-native node_modules/react-native
          ln -sfn ../../../node_modules/@react-native node_modules/@react-native
          # Gradle Hermes task traži hermes-compiler relativno od apps/mobile, ne iz root-a.
          ln -sfn ../../../node_modules/hermes-compiler node_modules/hermes-compiler

      # Release build pakuje JS kroz Metro, a Metro traži `packages/shared/dist`.
      # Debug APK to ne dira (dev server), pa je ovo moralo biti eksplicitno.
      - name: Build shared paketa (za Metro bundle)
        run: pnpm --filter @digitalni-asistent/shared build

      # Release AAB mora da gleda na pravi API (https). Bez URL-a dozvoljen je samo
      # RC/proof build, i tada je AAB označen upozorenjem i nije za Play.
      - name: API URL za release
        env:
          DA_API_URL: ${{ vars.DA_API_URL }}
          DA_WEB_URL: ${{ vars.DA_WEB_URL }}
          REF_NAME: ${{ github.ref_name }}
          ALLOW_DEBUG_INPUT: ${{ inputs.allow_debug_signing }}
        run: |
          set -euo pipefail
          if [ -z "${DA_API_URL:-}" ]; then
            if [[ "$REF_NAME" == *-rc* ]] || [ "$ALLOW_DEBUG_INPUT" = "true" ]; then
              echo "::warning::DA_API_URL nije postavljen — proof AAB koristi razvojni URL."
              exit 0
            fi
            echo "::error::DA_API_URL nije postavljen — release AAB ne može da se poveže na API."
            exit 1
          fi
          node apps/mobile/scripts/set-api-url.mjs --release

      # GitHub-hosted runner nema fajl keystore-a; dostavlja se kao base64 secret.
      - name: Pripremi keystore iz base64
        env:
          DA_KEYSTORE_BASE64: ${{ secrets.DA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DA_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            echo "DA_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore pripremljen iz DA_KEYSTORE_BASE64."
          fi

      # Bez keystore-a Gradle potpiše release debug ključem (vidi app/build.gradle).
      # Takav AAB služi samo kao dokaz da pipeline radi — ne smije na Play.
      # Pravilo: na tag push se debug potpis dozvoljava samo za `-rc` tagove; pravi release
      # tag (npr. v1.0.0) bez keystore-a pada, da se ne pošalje pogrešan AAB.
      - name: Provjera release keystore-a
        env:
          ALLOW_DEBUG_INPUT: ${{ inputs.allow_debug_signing }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DA_KEYSTORE_PATH:-}" ]; then
            if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == *-rc* ]]; then
              echo "::warning::RC tag bez keystore-a — AAB će biti potpisan DEBUG ključem (nije za Play)."
            elif [ "$ALLOW_DEBUG_INPUT" != "true" ]; then
              echo "::error::DA_KEYSTORE_PATH nije postavljen, a debug potpis nije dozvoljen."
              exit 1
            fi
            echo "::warning::DA_KEYSTORE_PATH nije postavljen — AAB će biti potpisan DEBUG ključem i nije za Play."
          else
            echo "Release keystore je postavljen."
          fi

      - name: Release AAB (bundleRelease)
        working-directory: apps/mobile/android
        env:
          DA_KEYSTORE_PASSWORD: ${{ secrets.DA_KEYSTORE_PASSWORD }}
          DA_KEY_ALIAS: ${{ secrets.DA_KEY_ALIAS }}
          DA_KEY_PASSWORD: ${{ secrets.DA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Sačuvaj AAB
        uses: actions/upload-artifact@v4
        with:
          name: digitalni-asistent-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Debug APK traži Metro (nema ugrađen JS bundle), pa nije pogodan za fizičke telefone.
      # Release APK je standalone i služi za matricu uređaja; do keystore-a je debug-potpisan.
      - name: Release APK za uređaje (assembleRelease)
        working-directory: apps/mobile/android
        env:
          DA_KEYSTORE_PASSWORD: ${{ secrets.DA_KEYSTORE_PASSWORD }}
          DA_KEY_ALIAS: ${{ secrets.DA_KEY_ALIAS }}
          DA_KEY_PASSWORD: ${{ secrets.DA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # APK bez ugrađenog JS bundle-a bi se instalirao ali ne bi mogao da se pokrene bez Metro-a.
      # Ovo je posljednja provjera prije nego artifact ode na telefone.
      - name: Provjeri JS bundle u release APK
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          echo "APK: $APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          echo "JS bundle je u APK-u."

      - name: Sačuvaj release APK
        uses: actions/upload-artifact@v4
        with:
          name: digitalni-asistent-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  docker:
    name: docker image (API + worker)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digitalni
          POSTGRES_PASSWORD: digitalni
          POSTGRES_DB: digitalni_asistent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalni -d digitalni_asistent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://digitalni:digitalni@localhost:5432/digitalni_asistent?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Build API/worker image
        run: docker build -f apps/api/Dockerfile -t digitalni-asistent-api:ci .

      - name: Migracije iz image-a
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            digitalni-asistent-api:ci \
            pnpm --filter api exec prisma migrate deploy

      - name: Demo seed
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SEED_RESET=1 \
            digitalni-asistent-api:ci \
            pnpm --filter api exec prisma db seed

      - name: API health iz image-a
        run: |
          docker run -d --name api-ci --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e SMS_PROVIDER=log -e MAIL_PROVIDER=log -e RATE_LIMIT_ENABLED=false \
            digitalni-asistent-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api-ci
          exit 1

      - name: Worker start iz image-a
        run: |
          docker run -d --name worker-ci --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e SMS_PROVIDER=log -e MAIL_PROVIDER=log \
            digitalni-asistent-api:ci node apps/api/dist/worker.js
          sleep 8
          docker logs worker-ci | grep -q "Worker pokrenut"

      - name: Cleanup
        if: always()
        run: docker rm -f api-ci worker-ci || true

  integrations:
    name: integracije (R2 / SMS / Sentry)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digitalni
          POSTGRES_PASSWORD: digitalni
          POSTGRES_DB: digitalni_asistent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalni -d digitalni_asistent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://digitalni:digitalni@localhost:5432/digitalni_asistent?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      RATE_LIMIT_ENABLED: 'false'
      MAIL_PROVIDER: log
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migracije
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma migrate deploy

      - name: Build (api + web)
        run: pnpm build

      - name: Demo seed
        run: pnpm --filter api db:seed

      - name: Integracije (fake S3/SMS/Sentry + API)
        run: pnpm test:integrations

  e2e:
    name: web e2e (Playwright)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digitalni
          POSTGRES_PASSWORD: digitalni
          POSTGRES_DB: digitalni_asistent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalni -d digitalni_asistent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://digitalni:digitalni@localhost:5432/digitalni_asistent?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      RATE_LIMIT_ENABLED: 'false'
      MAIL_PROVIDER: log
      SMS_PROVIDER: log
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalacija zavisnosti
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migracije
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma migrate deploy

      - name: Build (web + api + shared)
        run: pnpm build

      - name: Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (globalSetup radi seed)
        run: pnpm --filter web test:e2e

      - name: Sačuvaj Playwright izvještaj
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
