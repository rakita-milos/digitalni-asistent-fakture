pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    // pnpm (hoisted) ne pravi apps/mobile/node_modules/.bin, pa RN-ov default
    // `npx @react-native-community/cli config` pada; zovemo CLI direktno kroz node.
    def cliBin = new File(ex.settings.settingsDir, '../../../node_modules/@react-native-community/cli/build/bin.js')
    if (cliBin.exists()) {
        ex.autolinkLibrariesFromCommand(['node', cliBin.absolutePath, 'config'])
    } else {
        ex.autolinkLibrariesFromCommand()
    }
}

rootProject.name = 'DigitalniAsistent'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
